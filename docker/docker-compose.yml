# Breadboard as a monosite (Django + built React frontend on one port). A
# sample SQLite database (examples.db, seeded from samples/db) ships inside
# the image.
#
#   cd docker
#   cp .env.example .env      # then edit the secrets
#   docker compose up --build
#
# App: http://localhost:${BREADBOARD_PORT:-8000}
#
# Data: the app's SQLite database, the Manager -> Backup folder, and the
# bundled sample database (examples.db) live in the "breadboard-data" volume
# (/data). `docker compose down` keeps it; `docker compose down -v` wipes it,
# so examples.db is reseeded from the image (its current build) on next start.

services:
  breadboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: breadboard
    restart: unless-stopped
    ports:
      - "${BREADBOARD_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in docker/.env}
      BREADBOARD_CONNECTION_SECRET_KEY: ${BREADBOARD_CONNECTION_SECRET_KEY:?set BREADBOARD_CONNECTION_SECRET_KEY in docker/.env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
    volumes:
      - breadboard-data:/data

volumes:
  breadboard-data:
